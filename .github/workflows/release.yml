# Push a tag like v0.2.0 to build the Windows installers and attach them to a draft GitHub release.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # compiled into the app for hotel/restaurant search (src-tauri/src/places.rs); without it the app uses OpenStreetMap only
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          # Google sign-in (Desktop OAuth client); read by Vite at build time, kept out of the repo
          VITE_GOOGLE_DESKTOP_ID: ${{ secrets.VITE_GOOGLE_DESKTOP_ID }}
          VITE_GOOGLE_DESKTOP_SECRET: ${{ secrets.VITE_GOOGLE_DESKTOP_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Valigia ${{ github.ref_name }}
          releaseDraft: true
